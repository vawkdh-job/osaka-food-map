# Cloud Workflows: monthly caps for the Google APIs used by the app.
# Runs hourly (Cloud Scheduler, 07–23 JST). Reads this month's usage of each quota metric from Cloud Monitoring.
# When a metric's month total reaches its monthly limit, its daily quota override is set to 0 (requests stop);
# otherwise the daily limit is kept, so everything unblocks automatically when a new month starts.
#   Maps JavaScript API map loads   9,000 / month, 1,000 / day   (free usage 10,000 / month)
#   Places API (New) place details  1,500 / month,   500 / day   (free usage  1,000 / month; above that is billed)
#   Places API (New) place photos   1,500 / month,   500 / day   (free usage  1,000 / month; above that is billed)
# Optional execution argument for testing: {"monthlyLimit": 0} applies that monthly limit to every target.
main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - targets:
              - {service: "maps-backend.googleapis.com", metric: "maps-backend.googleapis.com/billable_default", monthly: 9000, daily: 1000}
              - {service: "places.googleapis.com", metric: "places.googleapis.com/GetPlaceRequest", monthly: 1500, daily: 500}
              - {service: "places.googleapis.com", metric: "places.googleapis.com/GetPhotoMediaRequest", monthly: 1500, daily: 500}
          - testLimit: ${map.get(args, "monthlyLimit")}
          - now: ${sys.now()}
          - nowText: ${time.format(now, "UTC")}
          - monthStart: ${text.substring(nowText, 0, 7) + "-01T00:00:00Z"}
          - period: ${string(int(now - time.parse(monthStart)) + 120) + "s"}
          - usage: {}
          - results: []
    - getUsage:
        call: http.get
        args:
          url: ${"https://monitoring.googleapis.com/v3/projects/" + project + "/timeSeries"}
          auth:
            type: OAuth2
          query:
            filter: 'metric.type="serviceruntime.googleapis.com/quota/rate/net_usage" AND resource.type="consumer_quota" AND metric.label.quota_metric=one_of("maps-backend.googleapis.com/billable_default","places.googleapis.com/GetPlaceRequest","places.googleapis.com/GetPhotoMediaRequest")'
            interval.startTime: ${monthStart}
            interval.endTime: ${nowText}
            aggregation.alignmentPeriod: ${period}
            aggregation.perSeriesAligner: ALIGN_SUM
            aggregation.crossSeriesReducer: REDUCE_SUM
            aggregation.groupByFields: metric.label.quota_metric
        result: usageResp
    - sumUsage:
        for:
          value: series
          in: ${default(map.get(usageResp.body, "timeSeries"), [])}
          steps:
            - addSeries:
                for:
                  value: p
                  in: ${series.points}
                  steps:
                    - add:
                        assign:
                          - usage[series.metric.labels.quota_metric]: ${default(map.get(usage, series.metric.labels.quota_metric), 0) + int(p.value.int64Value)}
    - eachTarget:
        for:
          value: t
          in: ${targets}
          steps:
            - getQuota:
                call: http.get
                args:
                  url: ${"https://serviceusage.googleapis.com/v1beta1/projects/" + project + "/services/" + t.service + "/consumerQuotaMetrics/" + text.url_encode(t.metric) + "/limits/%2Fd%2Fproject"}
                  auth:
                    type: OAuth2
                result: quotaResp
            - decide:
                assign:
                  - bucket: ${quotaResp.body.quotaBuckets[0]}
                  - current: ${int(default(map.get(bucket, "effectiveLimit"), "0"))}  # a limit of 0 is omitted from the response
                  - used: ${default(map.get(usage, t.metric), 0)}
                  - monthly: ${default(testLimit, t.monthly)}
                  - want: ${t.daily}
            - over:
                switch:
                  - condition: ${used >= monthly}
                    assign:
                      - want: 0
            - change:
                switch:
                  - condition: ${current == want}
                    next: note
                  - condition: ${"consumerOverride" in bucket}
                    call: http.patch
                    args:
                      url: ${"https://serviceusage.googleapis.com/v1beta1/" + bucket.consumerOverride.name}
                      auth:
                        type: OAuth2
                      query:
                        force: true
                      body:
                        overrideValue: ${string(want)}
                    next: note
                next: create
            - create:
                call: http.post
                args:
                  url: ${"https://serviceusage.googleapis.com/v1beta1/projects/" + project + "/services/" + t.service + "/consumerQuotaMetrics/" + text.url_encode(t.metric) + "/limits/%2Fd%2Fproject/consumerOverrides"}
                  auth:
                    type: OAuth2
                  query:
                    force: true
                  body:
                    overrideValue: ${string(want)}
            - note:
                assign:
                  - results: ${list.concat(results, text.split(t.metric, "/")[1] + " " + string(used) + "/" + string(monthly) + " daily " + string(current) + "->" + string(want))}
    - done:
        return: ${results}
