<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>오사카 미식 지도 · 종료</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d2a30;--muted:#5d6b70}
@media (prefers-color-scheme:dark){:root{--bg:#161a1c;--ink:#eef1f2;--muted:#9aa6aa}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
main{max-width:420px;padding:32px 20px;text-align:center}
h1{font-size:24px;margin:0 0 12px}
p{margin:0 0 10px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>🧳 오사카 여행이 끝났어요</h1>
<p>2026년 11월 13~15일 가족 여행용 지도는 이제 운영하지 않아요.</p>
<p>홈 화면에 추가해 둔 아이콘은 길게 눌러 삭제해 주세요.</p>
</main>
<script>
/* remove the saved app from this phone: service worker, caches and the app's settings */
(async()=>{try{if('serviceWorker' in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch(e){}
try{if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}
try{Object.keys(localStorage).filter(k=>k.startsWith('ofm.')).forEach(k=>localStorage.removeItem(k))}catch(e){}})();
</script>
</body>
</html>
